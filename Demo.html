<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nadmai — Demo</title><link rel="stylesheet" href="styles.css">
<style>html,body{height:100%}body{margin:0;background:var(--stone-100);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--surface-card);border-bottom:1px solid var(--border-default)}
.wm{font:600 20px/1 var(--font-sans);color:var(--text-strong);letter-spacing:-0.01em}.sub{font:var(--type-body-sm);color:var(--text-muted)}
.steps{margin-left:auto;display:flex;gap:18px;font:var(--type-caption);color:var(--text-muted)}.steps span{display:flex;align-items:center;gap:6px}.steps b{width:20px;height:20px;border-radius:50%;background:var(--teal-600);color:#fff;font:600 11px/20px var(--font-mono);text-align:center}
main{flex:1;min-height:0;display:flex;gap:24px;padding:24px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}.lbl{font:600 12px/1 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}
.phone{flex:none;width:390px;flex:1;max-height:844px;background:var(--stone-900);border-radius:44px;padding:10px;box-shadow:var(--shadow-lg);box-sizing:border-box}
.phone iframe{width:100%;height:100%;border:0;border-radius:34px;background:var(--bg-app)}
.desk{flex:1;min-width:0;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg);background:#fff;border:1px solid var(--border-default);position:relative}
.desk iframe{position:absolute;left:0;top:0;width:1280px;border:0;transform-origin:0 0}
@media (max-width:900px){.steps{display:none}main{flex-direction:column;overflow:auto}.phone{height:780px;flex:none}.desk{height:520px;flex:none}}</style></head>
<body><header><span class="wm">นัดรับสินค้า</span><span class="sub">Demo · ลูกค้านัดรับของที่ร้าน → เข้าปฏิทินร้านและ Google Calendar อัตโนมัติ</span>
<div class="steps"><span><b>1</b>เลือกร้าน + พิมพ์สินค้า</span><span><b>2</b>เลือกวันในสัปดาห์ 9–15 พ.ย.</span><span><b>3</b>กดยืนยันนัดรับ</span><span><b>4</b>ดูนัดเด้งขึ้นฝั่งร้าน</span></div></header>
<main><div class="col" style="width:390px;flex:none"><div class="lbl">หน้านัดรับของลูกค้า</div><div class="phone"><iframe src="ui_kits/booking/index.html" title="Booking"></iframe></div></div>
<div class="col" style="flex:1;min-width:0"><div class="lbl">แดชบอร์ดร้านค้า · ซิงก์ Google Calendar</div><div class="desk" id="desk"><iframe id="admin" src="ui_kits/admin/index.html" title="Admin"></iframe></div></div></main>
<script>
const desk=document.getElementById('desk'),admin=document.getElementById('admin');
function fit(){const s=Math.min(1,desk.clientWidth/1280);admin.style.transform='scale('+s+')';admin.style.height=(desk.clientHeight/s)+'px';}
new ResizeObserver(fit).observe(desk);fit();
window.addEventListener('message',e=>{if(e.data&&e.data.type==='nm-booked')admin.contentWindow.postMessage(e.data,'*');});
</script></body></html>

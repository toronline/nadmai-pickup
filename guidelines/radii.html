<!-- @dsCard group="Spacing" viewport="700x140" name="Corner radii" subtitle="xs → full" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.lbl{font:500 12px/1.4 var(--font-mono);color:var(--text-body);margin-top:6px}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row"><div style="text-align:center"><div style="width:80px;height:60px;background:var(--surface-brand-soft);border:1px solid var(--teal-200);border-radius:var(--radius-xs)"></div><div class="lbl">xs</div><div class="hex">4px</div></div><div style="text-align:center"><div style="width:80px;height:60px;background:var(--surface-brand-soft);border:1px solid var(--teal-200);border-radius:var(--radius-sm)"></div><div class="lbl">sm</div><div class="hex">6px</div></div><div style="text-align:center"><div style="width:80px;height:60px;background:var(--surface-brand-soft);border:1px solid var(--teal-200);border-radius:var(--radius-md)"></div><div class="lbl">md</div><div class="hex">10px</div></div><div style="text-align:center"><div style="width:80px;height:60px;background:var(--surface-brand-soft);border:1px solid var(--teal-200);border-radius:var(--radius-lg)"></div><div class="lbl">lg</div><div class="hex">14px</div></div><div style="text-align:center"><div style="width:80px;height:60px;background:var(--surface-brand-soft);border:1px solid var(--teal-200);border-radius:var(--radius-xl)"></div><div class="lbl">xl</div><div class="hex">20px</div></div><div style="text-align:center"><div style="width:80px;height:60px;background:var(--surface-brand-soft);border:1px solid var(--teal-200);border-radius:var(--radius-full)"></div><div class="lbl">full</div><div class="hex">999px</div></div></div></body></html>

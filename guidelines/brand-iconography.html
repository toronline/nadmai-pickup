<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.lbl{font:500 12px/1.4 var(--font-mono);color:var(--text-body);margin-top:6px}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style></head><body><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><div style="display:flex;gap:22px;color:var(--text-body)"><i data-lucide="calendar" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="calendar-check" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="calendar-plus" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="clock" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="map-pin" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="user" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="bell" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="video" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="repeat" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="check-circle-2" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="x" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="chevron-right" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="settings" style="width:24px;height:24px;stroke-width:2"></i><i data-lucide="link" style="width:24px;height:24px;stroke-width:2"></i></div><script>lucide.createIcons()</script></body></html>

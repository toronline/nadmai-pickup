<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.lbl{font:500 12px/1.4 var(--font-mono);color:var(--text-body);margin-top:6px}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="background:var(--bg-app);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:12px;height:70px"><div style="font:500 13px var(--font-sans);color:var(--text-strong)">App bg</div><div class="hex">--bg-app</div></div><div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:12px;height:70px"><div style="font:500 13px var(--font-sans);color:var(--text-strong)">Card</div><div class="hex">--surface-card</div></div><div style="background:var(--surface-sunken);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:12px;height:70px"><div style="font:500 13px var(--font-sans);color:var(--text-strong)">Sunken</div><div class="hex">--surface-sunken</div></div><div style="background:var(--surface-inverse);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:12px;height:70px"><div style="font:500 13px var(--font-sans);color:var(--text-inverse)">Inverse</div><div class="hex">--surface-inverse</div></div></div><div class="row" style="margin-top:12px;font:500 14px var(--font-sans)"><span style="color:var(--text-strong)">Strong</span><span style="color:var(--text-body)">Body</span><span style="color:var(--text-muted)">Muted</span><span style="color:var(--text-subtle)">Subtle</span><span style="color:var(--text-disabled)">Disabled</span><span style="color:var(--text-brand)">Brand</span></div></body></html>

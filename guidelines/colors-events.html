<!-- @dsCard group="Colors" viewport="700x130" name="Event categories" subtitle="Service colours on calendar" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.lbl{font:500 12px/1.4 var(--font-mono);color:var(--text-body);margin-top:6px}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row"><div class="sw"><div style="border-left:0;background:var(--event-teal);height:8px;border-radius:4px 4px 0 0"></div><div style="background:color-mix(in oklab,var(--event-teal) 12%,white);padding:8px;border-radius:0 0 6px 6px;font:500 12px/1.3 var(--font-sans);color:var(--text-strong)">10:00<br><span style="font-weight:400;color:var(--text-muted)">teal</span></div></div><div class="sw"><div style="border-left:0;background:var(--event-marigold);height:8px;border-radius:4px 4px 0 0"></div><div style="background:color-mix(in oklab,var(--event-marigold) 12%,white);padding:8px;border-radius:0 0 6px 6px;font:500 12px/1.3 var(--font-sans);color:var(--text-strong)">10:00<br><span style="font-weight:400;color:var(--text-muted)">marigold</span></div></div><div class="sw"><div style="border-left:0;background:var(--event-rose);height:8px;border-radius:4px 4px 0 0"></div><div style="background:color-mix(in oklab,var(--event-rose) 12%,white);padding:8px;border-radius:0 0 6px 6px;font:500 12px/1.3 var(--font-sans);color:var(--text-strong)">10:00<br><span style="font-weight:400;color:var(--text-muted)">rose</span></div></div><div class="sw"><div style="border-left:0;background:var(--event-indigo);height:8px;border-radius:4px 4px 0 0"></div><div style="background:color-mix(in oklab,var(--event-indigo) 12%,white);padding:8px;border-radius:0 0 6px 6px;font:500 12px/1.3 var(--font-sans);color:var(--text-strong)">10:00<br><span style="font-weight:400;color:var(--text-muted)">indigo</span></div></div><div class="sw"><div style="border-left:0;background:var(--event-olive);height:8px;border-radius:4px 4px 0 0"></div><div style="background:color-mix(in oklab,var(--event-olive) 12%,white);padding:8px;border-radius:0 0 6px 6px;font:500 12px/1.3 var(--font-sans);color:var(--text-strong)">10:00<br><span style="font-weight:400;color:var(--text-muted)">olive</span></div></div><div class="sw"><div style="border-left:0;background:var(--event-clay);height:8px;border-radius:4px 4px 0 0"></div><div style="background:color-mix(in oklab,var(--event-clay) 12%,white);padding:8px;border-radius:0 0 6px 6px;font:500 12px/1.3 var(--font-sans);color:var(--text-strong)">10:00<br><span style="font-weight:400;color:var(--text-muted)">clay</span></div></div></div></body></html>

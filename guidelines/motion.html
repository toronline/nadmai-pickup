<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.lbl{font:500 12px/1.4 var(--font-mono);color:var(--text-body);margin-top:6px}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style></head><body><style>.m{width:120px;height:56px;background:var(--surface-brand-soft);border:1px solid var(--teal-200);border-radius:var(--radius-md);animation:nm-fade-up var(--duration-base) var(--ease-out) infinite alternate;display:flex;align-items:center;justify-content:center;font:500 12px var(--font-mono);color:var(--text-brand)}</style><div style="display:flex;gap:24px;align-items:center"><div class="m">fade-up</div><div style="font:var(--type-body-sm);color:var(--text-muted)">fast 120ms · base 180ms · slow 280ms<br>ease-out cubic-bezier(.2,.7,.2,1). No bounces, no spring.</div></div></body></html>

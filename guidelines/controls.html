<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.lbl{font:500 12px/1.4 var(--font-mono);color:var(--text-body);margin-top:6px}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style></head><body><div style="display:flex;gap:16px;align-items:flex-end"><div style="height:var(--control-sm);padding:0 16px;border:1px solid var(--border-default);border-radius:var(--radius-md);display:flex;align-items:center;font:var(--type-label);color:var(--text-body)">control-sm</div><div style="height:var(--control-md);padding:0 16px;border:1px solid var(--border-default);border-radius:var(--radius-md);display:flex;align-items:center;font:var(--type-label);color:var(--text-body)">control-md</div><div style="height:var(--control-lg);padding:0 16px;border:1px solid var(--border-default);border-radius:var(--radius-md);display:flex;align-items:center;font:var(--type-label);color:var(--text-body)">control-lg</div><div style="height:48px;padding:0 16px;border:1px solid var(--border-focus);box-shadow:var(--focus-ring);border-radius:var(--radius-md);display:flex;align-items:center;font:var(--type-label);color:var(--text-body)">focus ring</div></div></body></html>

<!-- @dsCard group="Colors" viewport="700x110" name="Teal scale" subtitle="50–900" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.lbl{font:500 12px/1.4 var(--font-mono);color:var(--text-body);margin-top:6px}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row" style="gap:4px"><div class="sw" style="min-width:0"><div class="chip" style="background:var(--teal-50);border-radius:4px"></div><div class="lbl">50</div></div><div class="sw" style="min-width:0"><div class="chip" style="background:var(--teal-100);border-radius:4px"></div><div class="lbl">100</div></div><div class="sw" style="min-width:0"><div class="chip" style="background:var(--teal-200);border-radius:4px"></div><div class="lbl">200</div></div><div class="sw" style="min-width:0"><div class="chip" style="background:var(--teal-300);border-radius:4px"></div><div class="lbl">300</div></div><div class="sw" style="min-width:0"><div class="chip" style="background:var(--teal-400);border-radius:4px"></div><div class="lbl">400</div></div><div class="sw" style="min-width:0"><div class="chip" style="background:var(--teal-500);border-radius:4px"></div><div class="lbl">500</div></div><div class="sw" style="min-width:0"><div class="chip" style="background:var(--teal-600);border-radius:4px"></div><div class="lbl">600</div></div><div class="sw" style="min-width:0"><div class="chip" style="background:var(--teal-700);border-radius:4px"></div><div class="lbl">700</div></div><div class="sw" style="min-width:0"><div class="chip" style="background:var(--teal-800);border-radius:4px"></div><div class="lbl">800</div></div><div class="sw" style="min-width:0"><div class="chip" style="background:var(--teal-900);border-radius:4px"></div><div class="lbl">900</div></div></div></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.lbl{font:500 12px/1.4 var(--font-mono);color:var(--text-body);margin-top:6px}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--teal-600)"></div><div class="lbl">Teal 600 · primary</div><div class="hex">--teal-600</div></div><div class="sw"><div class="chip" style="background:var(--teal-700)"></div><div class="lbl">Teal 700 · hover</div><div class="hex">--teal-700</div></div><div class="sw"><div class="chip" style="background:var(--teal-50)"></div><div class="lbl">Teal 50 · soft</div><div class="hex">--teal-50</div></div><div class="sw"><div class="chip" style="background:var(--marigold-500)"></div><div class="lbl">Marigold · today</div><div class="hex">--marigold-500</div></div><div class="sw"><div class="chip" style="background:var(--marigold-50)"></div><div class="lbl">Marigold 50</div><div class="hex">--marigold-50</div></div></div></body></html>

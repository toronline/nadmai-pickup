<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success, warning, danger, info" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.lbl{font:500 12px/1.4 var(--font-mono);color:var(--text-body);margin-top:6px}.hex{font:400 11px/1.3 var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row"><div class="sw"><div style="display:flex;gap:4px"><div class="chip" style="flex:1;background:var(--status-success)"></div><div class="chip" style="flex:1;background:var(--status-success-soft)"></div></div><div class="lbl">success</div><div class="hex">--status-success(-soft)</div></div><div class="sw"><div style="display:flex;gap:4px"><div class="chip" style="flex:1;background:var(--status-warning)"></div><div class="chip" style="flex:1;background:var(--status-warning-soft)"></div></div><div class="lbl">warning</div><div class="hex">--status-warning(-soft)</div></div><div class="sw"><div style="display:flex;gap:4px"><div class="chip" style="flex:1;background:var(--status-danger)"></div><div class="chip" style="flex:1;background:var(--status-danger-soft)"></div></div><div class="lbl">danger</div><div class="hex">--status-danger(-soft)</div></div><div class="sw"><div style="display:flex;gap:4px"><div class="chip" style="flex:1;background:var(--status-info)"></div><div class="chip" style="flex:1;background:var(--status-info-soft)"></div></div><div class="lbl">info</div><div class="hex">--status-info(-soft)</div></div></div></body></html>
